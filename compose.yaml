services:
  # Development data survives container recreation through the named volume.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - real_estate_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_estate -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Separate disposable database prevents integration tests from touching development data.
  postgres-test:
    image: postgres:17
    profiles: [tests]
    environment:
      POSTGRES_DB: real_estate_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:5433:5432"
    # Disposable database, deliberately distinct from the persistent development volume.
    # This storage is temporary; do not use it for shared demo records.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d real_estate_test"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  real_estate_data: