# logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
spring.application.name=real-estate-management
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/real_estate}
spring.datasource.username=${DB_USERNAME:real_estate}
spring.datasource.password=${DB_PASSWORD:local_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.jpa.repositories.enabled=false
spring.flyway.enabled=true

# Keep the application runnable while JPA integration is in progress.
spring.profiles.default=memory