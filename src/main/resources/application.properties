spring.application.name=real-estate-management
# Environment variables override these local development defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/real_estate}
spring.datasource.username=${DB_USERNAME:real_estate}
spring.datasource.password=${DB_PASSWORD:local_dev_only}
# Flyway owns schema changes; Hibernate only checks that mappings match.
spring.jpa.hibernate.ddl-auto=validate
# Database access should happen within application transactions, not web response rendering.
spring.jpa.open-in-view=false
# Keep JDBC timestamp handling consistent across developer machines and CI.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JpaPersistenceConfiguration performs explicit, profile-controlled repository scanning.
spring.data.jpa.repositories.enabled=false
# Apply pending versioned SQL migrations when the PostgreSQL configuration starts.
spring.flyway.enabled=true