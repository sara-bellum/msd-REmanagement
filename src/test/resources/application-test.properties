# Integration tests use a disposable database, separate from development data.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/real_estate_test}
spring.datasource.username=${TEST_DB_USERNAME:test}
spring.datasource.password=${TEST_DB_PASSWORD:test}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
